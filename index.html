<html lang="en">

<style>
:root{color-scheme:light;--ink:#20252a;--muted:#606a6c;--line:#e0e4df;--paper:#fff;--canvas:#f4f6f1;--green:#175945;--pale:#e6f2eb;--mono:"IBM Plex Mono",monospace;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px var(--sans);background:var(--paper)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #258865;outline-offset:2px}
button{background:white;border:1px solid var(--line);border-radius:7px;padding:7px 10px;display:inline-flex;gap:7px;align-items:center;justify-content:center;font-weight:600}
button:not(:disabled):hover{background:#eef3ed}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#104735}.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top,.toolbar,.status{display:flex;align-items:center;gap:12px;padding:0 19px}.top{min-height:65px;justify-content:space-between;border-bottom:1px solid var(--line)}.toolbar{min-height:48px;border-bottom:1px solid var(--line);gap:6px;background:#fafbf9}.top-group{display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--green);color:white;font:bold 19px var(--sans)}.brand strong{font-size:17px;letter-spacing:-.045em}.divider{height:24px;width:1px;background:var(--line);margin:0 5px}.doc-title{border:1px solid transparent;background:transparent;border-radius:5px;padding:6px;width:clamp(115px,20vw,270px);font-weight:600}.doc-title:hover{border-color:var(--line)}
.tool{height:34px;border-color:transparent;background:transparent}.tool[aria-pressed=true]{background:var(--pale);color:var(--green);border-color:#cbded2}.icon-only{width:34px;padding:0}.toolbar .spacer{flex:1}.zoom-label{font:12px var(--mono);min-width:50px;text-align:center}

.palette,.inspector{overflow:auto;background:white}.palette{border-right:1px solid var(--line);padding:20px 13px}.inspector{border-left:1px solid var(--line);padding:20px 16px}.panel-title{font-size:15px;margin:0 0 18px;font-weight:700;letter-spacing:-.025em}.section{margin-bottom:16px}.section h3,.eyebrow{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}.palette button{width:100%;justify-content:flex-start;border-color:transparent;background:transparent;padding:6px 7px;min-height:31px;font-size:13px;text-align:left;line-height:1.25}.palette button .icon{color:var(--green)}.palette button[aria-pressed=true]{background:var(--pale);color:var(--green);border-color:#cbded2}.palette .hint{border-top:1px solid var(--line);padding:12px 6px 0}
.stage{position:relative;overflow:hidden;background:var(--canvas);min-width:0}.diagram{width:100%;height:100%;display:block;touch-action:none;user-select:none;outline-offset:-3px}.stage[data-mode=pan] .diagram{cursor:grab}.stage[data-mode=draw] .diagram{cursor:crosshair}.stage.dragging .diagram{cursor:grabbing}.stage-caption{position:absolute;left:13px;bottom:13px;background:#ffffffed;border:1px solid var(--line);border-radius:6px;padding:6px 9px;pointer-events:none;color:var(--muted);font:11px var(--mono)}.empty{position:absolute;pointer-events:none;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted)}.empty strong{color:var(--ink);font-size:19px;margin-bottom:5px}.empty[hidden]{display:none}
.status{min-height:32px;justify-content:space-between;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:#fafbf9}.status [data-error=true]{color:#a12924}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 13px}.empty-inspector{border:1px dashed var(--line);background:#fafbf9;border-radius:8px;padding:12px}.inspector h3{margin:0 0 8px;font-size:15px}.inspector label{display:grid;gap:4px;margin-bottom:11px;font-size:12px;font-weight:600}.inspector input,.inspector select{width:100%;padding:7px;border:1px solid #d5ddd5;background:#fff;border-radius:5px;font-size:13px}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1 1 75px}.inspector button{font-size:12px}.inspector .subsection{margin:15px 0;border-top:1px solid var(--line);padding-top:13px}.inspector .entry{display:flex;width:100%;justify-content:space-between;margin-bottom:5px;text-align:left}.remove{color:#a12924}.inspector .full{width:100%;margin-top:6px}
.diagram text{font-family:var(--sans);fill:var(--ink);pointer-events:none}.diagram .title{font-weight:700;font-size:15px}.diagram .small{font:500 10px var(--mono);fill:#53655c}.diagram .symbol,.diagram .edge,.diagram .hit{vector-effect:non-scaling-stroke}.diagram .element{cursor:move}.diagram .pick{cursor:pointer}.diagram .active .symbol{stroke:#218b65;stroke-width:2.4}.diagram .source .symbol{stroke:#b06919;stroke-width:2.7}.diagram .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}.diagram .edge{fill:none;stroke:#435f53;stroke-width:1.5;pointer-events:none}.diagram .active .edge{stroke:#218b65;stroke-width:2.5}.diagram .connect{stroke-dasharray:1 5;stroke-linecap:round}.diagram .label{font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
@media(max-width:960px){.work{grid-template-columns:175px minmax(0,1fr) 195px}.inspector{padding:15px 12px}.palette{padding:15px 9px}.palette button{font-size:12px}.toolbar,.top,.status{padding-inline:10px}}
@media(max-width:680px){.app{min-height:740px;height:100dvh}.top{flex-wrap:wrap;padding-block:8px;gap:6px}.brand strong{font-size:15px}.top-group{gap:4px}.top button{font-size:12px;padding:5px 6px}.top .divider{display:none}.toolbar{gap:2px}.toolbar .tool{padding:4px 6px}.toolbar .tool span{display:none}.work{grid-template-columns:130px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 164px}.inspector{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:10px}.palette{padding:8px 4px}.palette button{font-size:11px;padding:4px;min-height:27px}.panel-title{margin-bottom:10px}.status{gap:8px}.status #storage{display:none}}

<body>
<div class="app">
<header class="top">
  <div class="top-group"><div class="brand"><div class="brand-mark" aria-hidden="true">eÂ³</div><strong>Value Model Editor</strong></div><div class="divider"></div><input class="doc-title" id="model-title" aria-label="Model name" maxlength="100"></div>
  <div class="top-group"><button id="new-model">New</button><button id="open-model">Open</button><button id="save-model" class="primary">Save model</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</header>
<nav class="toolbar" aria-label="Canvas controls">
  <button class="tool" id="select-tool" aria-pressed="true"><span>Select</span></button><button class="tool" id="pan-tool" aria-pressed="false"><span>Pan</span></button>
  <div class="divider"></div><button class="tool icon-only" id="undo" aria-label="Undo" title="Undo (Ctrl/âŒ˜+Z)"></button><button class="tool icon-only" id="redo" aria-label="Redo" title="Redo (Ctrl/âŒ˜+Shift+Z)"></button>
  <div class="spacer"></div><button class="tool icon-only" id="zoom-out" aria-label="Zoom out"></button><span id="zoom" class="zoom-label">100%</span><button class="tool icon-only" id="zoom-in" aria-label="Zoom in"></button><button class="tool" id="fit" aria-label="Fit model" title="Fit model"><span>Fit</span></button>
</nav>
<main class="work">
  <aside class="palette" aria-label="Model elements"><h2 class="panel-title">Elements</h2><div id="palette"></div><p class="hint">Choose an element, then click the canvas. Press Esc to return to Select.</p></aside>
  <section class="stage" id="stage" aria-label="Model canvas">
    <svg class="diagram" id="diagram" xmlns="http://www.w3.org/2000/svg" aria-label="Value model diagram" tabindex="0">
      <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c9d3c8"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/><g id="world"></g>
    </svg>
    <div class="empty" id="empty" hidden><strong>Start your model</strong><span>Place an Actor or Market Segment.</span></div>
    <div class="stage-caption" id="counts"></div>
  </section>
  <aside class="inspector" aria-label="Properties"><h2 class="panel-title">Properties</h2><div id="properties"></div></aside>
</main>
<footer class="status"><span id="message" role="status"></span><span id="storage">Changes saved in this browser</span></footer>
</div>
<script>
'use strict';

const $ = id => document.getElementById(id);
const diagram = $('diagram');
const world = $('world');
const storageKey = 'e3-value-model-v1';
const svgNS = 'http://www.w3.org/2000/svg';
const names = {
  actor:'Actor', market:'Market Segment', composite:'Composite Actor', activity:'Value Activity',
  interface:'Value Interface', offering:'Value Offering', port:'Value Port', exchange:'Value Exchange',
  start:'Start Stimulus', stop:'Stop Stimulus', connect:'Connect Element'
};
const icons = {
  actor:'<rect x="3" y="4" width="14" height="12" rx="1"/>',
  market:'<path d="M6 2h12v11M4 4h12v11"/><rect x="2" y="6" width="12" height="11" rx="1"/>',
  composite:'<rect x="2" y="3" width="16" height="14" rx="1" stroke-dasharray="2 2"/><rect x="5" y="7" width="4" height="6"/><rect x="11" y="7" width="4" height="6"/>',
  activity:'<rect x="2" y="5" width="16" height="10" rx="4"/>',
  interface:'<rect x="5" y="2" width="10" height="16" rx="4"/><path d="m7 6 4 2-4 2zm6 5-4 2 4 2z"/>',
  offering:'<path d="M6 3H3v14h3m2-12 5 2-5 2zm0 6 5 2-5 2z"/>',
  port:'<path d="m6 4 10 6-10 6z"/>',
  exchange:'<path d="M2 10h16m-4-4 4 4-4 4"/>',
  start:'<circle cx="10" cy="10" r="4" fill="currentColor"/>',
  stop:'<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3" fill="currentColor"/>',
  connect:'<path d="M3 10h14" stroke-dasharray="1 3"/><circle cx="2" cy="10" r="1"/><circle cx="18" cy="10" r="1"/>',
  select:'<path d="m4 2 12 9-6 1-2 6z"/>',
  pan:'<path d="M6 10V5a1 1 0 0 1 2 0v4-6a1 1 0 0 1 2 0v6-5a1 1 0 0 1 2 0v5-3a1 1 0 0 1 2 0v7a4 4 0 0 1-4 4H9c-1.5 0-2.4-.7-3.1-1.7l-2.4-3.4a1.2 1.2 0 0 1 1.8-1.5L6 11"/>',
  undo:'<path d="M7 5 3 9l4 4M3 9h9a4 4 0 0 1 4 4v2"/>',
  redo:'<path d="m13 5 4 4-4 4m4-4H8a4 4 0 0 0-4 4v2"/>',
  minus:'<path d="M5 10h10"/>', plus:'<path d="M5 10h10m-5-5v10"/>',
  fit:'<path d="M3 7V3h4m6 0h4v4m0 6v4h-4m-6 0H3v-4"/><rect x="7" y="7" width="6" height="6"/>'
};
const icon = type => '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">'+icons[type]+'</svg>';
const isActor = node => ['actor','market','composite'].includes(node?.type);
const isBox = node => isActor(node) || node?.type === 'activity';
const isStimulus = node => ['start','stop'].includes(node?.type);
const get = id => model.nodes.find(node => node.id === id);
const edgeById = id => model.edges.find(edge => edge.id === id);
const children = id => model.nodes.filter(node => node.parent === id);
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const snap = n => Math.round(n / 10) * 10;
const uid = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const blank = () => ({version:1,title:'Untitled model',nodes:[],edges:[]});
const sample = () => ({
  version:1,title:'Bread for money',
  nodes:[
    {id:'bakery',type:'actor',name:'Bakery',x:90,y:150,w:240,h:245,parent:null},
    {id:'customers',type:'market',name:'Customers',x:575,y:150,w:240,h:245,parent:null},
    {id:'bake',type:'activity',name:'Bake bread',x:32,y:69,w:135,h:145,parent:'bakery'},
    {id:'seller',type:'interface',name:'Sell bread',parent:'bakery',side:'right',offset:.51},
    {id:'buyer',type:'interface',name:'Buy bread',parent:'customers',side:'left',offset:.51},
    {id:'bo',type:'offering',parent:'seller',direction:'out'}, {id:'bi',type:'offering',parent:'seller',direction:'in'},
    {id:'ci',type:'offering',parent:'buyer',direction:'in'}, {id:'co',type:'offering',parent:'buyer',direction:'out'},
    {id:'bread-out',type:'port',parent:'bo'}, {id:'bread-in',type:'port',parent:'ci'},
    {id:'money-out',type:'port',parent:'co'}, {id:'money-in',type:'port',parent:'bi'},
    {id:'need',type:'start',name:'Need bread',x:146,y:125,parent:'customers'},
    {id:'done',type:'stop',name:'Bread supplied',x:54,y:56,parent:'bake'}
  ],
  edges:[
    {id:'bread',type:'exchange',from:'bread-out',to:'bread-in',name:'Bread'},
    {id:'money',type:'exchange',from:'money-out',to:'money-in',name:'Money'},
    {id:'start-path',type:'connect',from:'need',to:'buyer'},
    {id:'stop-path',type:'connect',from:'seller',to:'done'}
  ]
});

let model = sample();
try {
  const saved = localStorage.getItem(storageKey);
  if (saved) model = validate(JSON.parse(saved));
} catch {
  $('storage').textContent = 'Could not restore the browser copy';
}
let selected = null;
let mode = 'select';
let source = null;
let camera = {x:0,y:0,scale:1};
let drag = null;
let ignoreClick = false;
const undoStack = [];
const redoStack = [];

function validate(data) {
  if (data?.version !== 1 || typeof data.title !== 'string' || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
    throw Error('Choose an eÂ³-value model JSON file.');
  }
  const nodes = new Map();
  const ids = new Set();
  for (const item of [...data.nodes,...data.edges]) {
    if (!item || typeof item.id !== 'string' || !item.id || ids.has(item.id)) throw Error('The model has invalid element IDs.');
    ids.add(item.id);
  }
  for (const node of data.nodes) {
    if (!['actor','market','composite','activity','interface','offering','port','start','stop'].includes(node.type)) throw Error('Unknown model element.');
    if ((isBox(node) || isStimulus(node)) && ![node.x,node.y].every(Number.isFinite)) throw Error('Invalid element position.');
    if (isBox(node) && (![node.w,node.h].every(Number.isFinite) || node.w < 100 || node.h < 75)) throw Error('Invalid element size.');
    if (node.type === 'interface' && (!['left','right'].includes(node.side) || !Number.isFinite(node.offset) || node.offset < 0 || node.offset > 1)) throw Error('Invalid Value Interface.');
    if (node.type === 'offering' && !['in','out'].includes(node.direction)) throw Error('Invalid Value Offering direction.');
    if (node.name !== undefined && typeof node.name !== 'string') throw Error('Invalid element name.');
    nodes.set(node.id,node);
  }
  const offeringKeys = new Set();
  for (const node of data.nodes) {
    const parent = nodes.get(node.parent);
    if ((node.parent != null && !parent) || !allowedParent(node.type,parent)) throw Error('An element has an invalid parent.');
    if (node.type === 'offering') {
      const key = JSON.stringify([node.parent,node.direction]);
      if (offeringKeys.has(key)) throw Error('A Value Interface has duplicate offerings in one direction.');
      offeringKeys.add(key);
    }
    const visited = new Set([node.id]);
    for (let ancestor = parent; ancestor; ancestor = nodes.get(ancestor.parent)) {
      if (visited.has(ancestor.id)) throw Error('The model contains a circular parent reference.');
      visited.add(ancestor.id);
    }
  }
  const lookup = id => nodes.get(id);
  const links = new Set();
  for (const edge of data.edges) {
    const from = lookup(edge.from);
    const to = lookup(edge.to);
    const endpoints = JSON.stringify([edge.type,...[edge.from,edge.to].sort()]);
    if (links.has(endpoints) || (edge.type === 'exchange' && typeof edge.name !== 'string')
        || !validLink(edge.type,from,to,lookup)) throw Error('The model has an invalid connection.');
    links.add(endpoints);
  }
  return data;
}

function allowedParent(type,parent) {
  if (['actor','market','composite'].includes(type)) return !parent || parent.type === 'composite';
  if (type === 'activity') return isActor(parent);
  if (type === 'interface') return isBox(parent);
  if (type === 'offering') return parent?.type === 'interface';
  if (type === 'port') return parent?.type === 'offering';
  return ['start','stop'].includes(type) && (!parent || isBox(parent));
}

function interfaceOf(node, lookup = get) {
  return node?.type === 'port' ? lookup(lookup(node.parent)?.parent) : node;
}
function validLink(type,from,to,lookup = get) {
  if (!from || !to || from.id === to.id) return false;
  if (type === 'exchange') {
    return from.type === 'port' && to.type === 'port'
      && lookup(from.parent)?.direction === 'out' && lookup(to.parent)?.direction === 'in'
      && interfaceOf(from,lookup)?.id !== interfaceOf(to,lookup)?.id;
  }
  if (type !== 'connect') return false;
  if (from.type === 'interface' && to.type === 'interface') {
    const firstOwner = lookup(from.parent);
    const secondOwner = lookup(to.parent);
    return firstOwner?.id === secondOwner?.id
      || firstOwner?.parent === secondOwner?.id || secondOwner?.parent === firstOwner?.id;
  }
  return (isStimulus(from) && to.type === 'interface') || (from.type === 'interface' && isStimulus(to));
}

function saveLocal() {
  try {
    localStorage.setItem(storageKey,JSON.stringify(model));
    $('storage').textContent = 'Changes saved in this browser';
  } catch {
    $('storage').textContent = 'Use Save model to keep your changes';
  }
}
function record(previous) {
  undoStack.push(previous);
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  saveLocal();
}
function change(action) {
  const before = JSON.stringify(model);
  action();
  if (JSON.stringify(model) !== before) record(before);
  render();
}
function restore(from,to) {
  if (!from.length) return;
  to.push(JSON.stringify(model));
  model = JSON.parse(from.pop());
  selected = null;
  source = null;
  saveLocal();
  render();
}
function notice(text,error = false) {
  $('message').textContent = text;
  $('message').dataset.error = error;
}
const instructions = {
  select:'Drag elements to move them.',
  pan:'Drag the canvas to pan.',
  actor:'Click the canvas or inside a Composite Actor.',
  market:'Click the canvas or inside a Composite Actor.',
  composite:'Click the canvas or inside a Composite Actor.',
  activity:'Click inside the Actor, Market Segment, or Composite Actor that performs this activity.',
  interface:'Click an Actor or Value Activity near its left or right border.',
  offering:'Click a Value Interface, then choose the direction.',
  port:'Click a Value Interface, then choose the offering direction.',
  start:'Click where the value scenario starts.',
  stop:'Click where the value scenario ends.',
  exchange:'Click the outgoing Value Port.',
  connect:'Click a Stimulus or Value Interface.'
};
function setMode(next) {
  mode = next;
  source = null;
  notice(instructions[mode]);
  render();
}

function position(node) {
  const parent = get(node.parent);
  if (node.type === 'interface') {
    const base = position(parent);
    return {x:base.x+(node.side === 'right' ? parent.w : 0),y:base.y+node.offset*parent.h};
  }
  if (node.type === 'port') {
    const iface = get(get(node.parent).parent);
    const center = position(iface);
    const layout = portLayout(iface).find(item => item.port.id === node.id);
    return {x:center.x,y:center.y+layout.y};
  }
  const base = parent ? position(parent) : {x:0,y:0};
  return {x:base.x+node.x,y:base.y+node.y};
}
function portLayout(iface) {
  const groups = children(iface.id).sort((a,b) => iface.side === 'right' ? b.direction.localeCompare(a.direction) : a.direction.localeCompare(b.direction));
  const ports = groups.flatMap(group => children(group.id).map(port => ({port,direction:group.direction})));
  const gap = 20;
  return ports.map((item,index) => ({...item,y:(index-(ports.length-1)/2)*gap}));
}
function S(tag,attrs = {},content) {
  const element = document.createElementNS(svgNS,tag);
  for (const [key,value] of Object.entries(attrs)) element.setAttribute(key,value);
  if (content !== undefined) element.textContent = content;
  return element;
}
function group(item,css) {
  return S('g',{'data-id':item.id,class:css+(selected === item.id?' active':'')+(source === item.id?' source':'')});
}
function shorten(text,max) {
  return text.length <= max ? text : text.slice(0,Math.max(1,max-1))+'â€¦';
}
function drawBox(node) {
  const point = position(node);
  const g = group(node,'element');
  g.setAttribute('transform','translate('+point.x+' '+point.y+')');
  const colors = node.type === 'activity' ? ['#eaf3ed','#759487']
    : node.type === 'market' ? ['#f0f1e6','#7f8968']
    : node.type === 'composite' ? ['#eef3f7','#6e8190'] : ['#fbfcf9','#75877d'];
  if (node.type === 'market') {
    for (const shift of [10,5]) g.append(S('rect',{x:shift,y:-shift,width:node.w,height:node.h,fill:colors[0],stroke:colors[1],class:'symbol'}));
  }
  const rect = S('rect',{width:node.w,height:node.h,rx:node.type === 'activity' ? 12 : 1,fill:colors[0],stroke:colors[1],class:'symbol'});
  if (node.type === 'composite') rect.setAttribute('stroke-dasharray','5 4');
  g.append(rect,S('title',{},node.name || names[node.type]),
    S('text',{x:13,y:19,class:'small'},names[node.type].toUpperCase()),
    S('text',{x:13,y:40,class:'title'},shorten(node.name || names[node.type],Math.floor((node.w-24)/8))));
  world.append(g);
  for (const child of children(node.id).filter(isBox)) drawBox(child);
}
function drawInterface(node) {
  const p = position(node);
  const ports = portLayout(node);
  const height = Math.max(30,ports.length*20+10);
  const g = group(node,'element');
  g.setAttribute('transform','translate('+p.x+' '+p.y+')');
  g.append(S('rect',{x:-12,y:-height/2,width:24,height,rx:11,fill:'#fff',stroke:'#57776a',class:'symbol'}),S('title',{},node.name || names.interface));
  const sign = node.side === 'right' ? 1 : -1;
  for (const offer of children(node.id)) {
    const entries = ports.filter(item => item.port.parent === offer.id);
    if (entries.length < 2) continue;
    const y1 = entries[0].y-7;
    const y2 = entries.at(-1).y+7;
    const bracket = group(offer,'pick');
    const path = 'M '+(-sign*6)+' '+y1+' h '+(-sign*4)+' V '+y2+' h '+(sign*4);
    bracket.append(S('path',{d:path,class:'hit',style:'stroke-width:5'}),S('path',{d:path,class:'edge symbol'}));
    bracket.append(S('title',{},offer.direction === 'in' ? 'Incoming Value Offering' : 'Outgoing Value Offering'));
    g.append(bracket);
  }
  for (const {port,direction,y} of ports) {
    const portGroup = group(port,'pick');
    const facing = direction === 'out' ? sign : -sign;
    portGroup.append(S('rect',{x:-7,y:y-9,width:14,height:18,fill:'transparent'}),
      S('polygon',{points:[[-5*facing,y-5],[5*facing,y],[-5*facing,y+5]].map(pair=>pair.join(',')).join(' '),fill:'#3f6655',stroke:'#3f6655',class:'symbol'}),
      S('title',{},direction === 'out' ? 'Outgoing Value Port' : 'Incoming Value Port'));
    g.append(portGroup);
  }
  world.append(g);
}
function drawStimulus(node) {
  const p = position(node);
  const g = group(node,'element');
  const radius = node.type === 'stop' ? 10 : 7;
  g.append(S('circle',{cx:p.x,cy:p.y,r:13,fill:'transparent'}),
    S('circle',{cx:p.x,cy:p.y,r:radius,fill:node.type === 'stop' ? '#f7fbf8' : '#315c4a',stroke:'#315c4a',class:'symbol'}));
  if (node.type === 'stop') g.append(S('circle',{cx:p.x,cy:p.y,r:5,fill:'#315c4a','pointer-events':'none'}));
  if (node.name) g.append(S('text',{x:p.x,y:p.y+25,'text-anchor':'middle',class:'small'},node.name));
  g.append(S('title',{},names[node.type]));
  world.append(g);
}
function drawEdge(edge) {
  const from = get(edge.from);
  const to = get(edge.to);
  const a = position(from);
  const b = position(to);
  const g = group(edge,'pick');
  let path = 'M '+a.x+' '+a.y+' L '+b.x+' '+b.y;
  let labelX = (a.x+b.x)/2;
  let labelY = (a.y+b.y)/2;
  if (edge.type === 'exchange') {
    const fromSide = interfaceOf(from).side === 'right' ? 1 : -1;
    const toSide = interfaceOf(to).side === 'right' ? 1 : -1;
    const reach = Math.max(32,Math.abs(b.x-a.x)*.46);
    const c = a.x+fromSide*reach;
    const d = b.x+toSide*reach;
    path = 'M '+a.x+' '+a.y+' C '+c+' '+a.y+' '+d+' '+b.y+' '+b.x+' '+b.y;
    labelX = (a.x+3*c+3*d+b.x)/8;
    if (Math.abs(labelX-a.x)<30 && Math.abs(labelX-b.x)<30) labelX += fromSide*25;
  }
  g.append(S('path',{d:path,class:'hit'}),S('path',{d:path,class:'edge'+(edge.type === 'connect'?' connect':'')}));
  if (edge.type === 'exchange' && edge.name) {
    const label = S('text',{x:labelX,y:labelY-6,'text-anchor':'middle',class:'label'},edge.name);
    label.style.pointerEvents = 'all';
    g.append(label);
  }
  g.append(S('title',{},edge.name || names[edge.type]));
  world.append(g);
}

function cameraView() {
  world.setAttribute('transform','translate('+camera.x+' '+camera.y+') scale('+camera.scale+')');
  $('grid').setAttribute('patternTransform','translate('+camera.x+' '+camera.y+') scale('+camera.scale+')');
  $('zoom').textContent = Math.round(camera.scale*100)+'%';
}
function draw() {
  world.replaceChildren();
  for (const node of model.nodes.filter(node => isBox(node) && !node.parent)) drawBox(node);
  for (const edge of model.edges) drawEdge(edge);
  for (const node of model.nodes) {
    if (node.type === 'interface') drawInterface(node);
    if (isStimulus(node)) drawStimulus(node);
  }
  cameraView();
  $('empty').hidden = model.nodes.length > 0 || mode !== 'select';
  const actors = model.nodes.filter(isActor).length;
  const exchanges = model.edges.filter(edge => edge.type === 'exchange').length;
  $('counts').textContent = actors+' '+(actors === 1 ? 'actor' : 'actors')+' Â· '+exchanges+' '+(exchanges === 1 ? 'exchange' : 'exchanges');
}
function fit() {
  const points = model.nodes.filter(node => isBox(node) || isStimulus(node)).map(node => ({...position(node),w:node.w||10,h:node.h||25}));
  if (!points.length) {
    camera = {x:0,y:0,scale:1};
  } else {
    const x1 = Math.min(...points.map(p => p.x))-29;
    const y1 = Math.min(...points.map(p => p.y))-29;
    const x2 = Math.max(...points.map(p => p.x+p.w))+29;
    const y2 = Math.max(...points.map(p => p.y+p.h))+29;
    const bounds = diagram.getBoundingClientRect();
    const scale = clamp(Math.min((bounds.width-20)/(x2-x1),(bounds.height-20)/(y2-y1)),.1,1.15);
    camera = {x:(bounds.width-(x2+x1)*scale)/2,y:(bounds.height-(y2+y1)*scale)/2,scale};
  }
  cameraView();
}
function zoomBy(factor,x = diagram.clientWidth/2,y = diagram.clientHeight/2) {
  const old = camera.scale;
  camera.scale = clamp(old*factor,.1,3);
  camera.x = x-(x-camera.x)*camera.scale/old;
  camera.y = y-(y-camera.y)*camera.scale/old;
  cameraView();
}

function button(label,action,css = '') {
  const el = document.createElement('button');
  el.textContent = label;
  el.className = css;
  el.addEventListener('click',action);
  return el;
}
function field(label,value,update,options = {}) {
  const row = document.createElement('label');
  row.textContent = label;
  const input = document.createElement(options.choices ? 'select' : 'input');
  if (options.choices) {
    for (const [key,text] of options.choices) input.add(new Option(text,key));
  } else {
    input.type = options.type || 'text';
    input.maxLength = 100;
    if (options.min) input.min = options.min;
    if (options.step) input.step = options.step;
  }
  input.value = value ?? '';
  input.addEventListener('change',() => {
    if (input.reportValidity()) update(options.type === 'number' ? input.valueAsNumber : input.value);
  });
  row.append(input);
  return row;
}
function hint(text,css = 'hint') {
  const el = document.createElement('p');
  el.className = css;
  el.textContent = text;
  return el;
}
function subtitle(text) {
  const el = document.createElement('h3');
  el.textContent = text;
  return el;
}
function select(id) {
  mode = 'select';
  source = null;
  selected = id;
  notice(instructions.select);
  render();
}
function setProperty(item,key,value) {
  change(() => item[key] = value);
}
function offeringFor(iface,direction) {
  return children(iface.id).find(node => node.direction === direction);
}
function addOffering(iface,direction,withPort) {
  change(() => {
    let offering = offeringFor(iface,direction);
    if (!offering) {
      offering = {id:uid(),type:'offering',parent:iface.id,direction};
      model.nodes.push(offering);
    }
    selected = offering.id;
    if (withPort) {
      const port = {id:uid(),type:'port',parent:offering.id};
      model.nodes.push(port);
      selected = port.id;
    }
    mode = 'select';
    source = null;
    notice(instructions.select);
  });
}
function remove(id) {
  change(() => {
    const gone = new Set();
    function collect(nodeId) {
      gone.add(nodeId);
      children(nodeId).forEach(child => collect(child.id));
    }
    collect(id);
    model.nodes = model.nodes.filter(node => !gone.has(node.id));
    model.edges = model.edges.filter(edge => ![edge.id,edge.from,edge.to].some(value => gone.has(value)));
    selected = null;
    source = null;
    notice('Element deleted. Use Undo to restore it.');
  });
}
function renderProperties() {
  const container = $('properties');
  container.replaceChildren();
  const node = get(selected);
  const edge = edgeById(selected);
  const item = node || edge;
  if (!item) {
    const panel = document.createElement('div');
    panel.className = 'empty-inspector';
    panel.append(subtitle('No element selected'),hint('Select an element to edit its properties.'));
    container.append(panel);
    return;
  }
  container.append(subtitle(names[item.type]));
  if (isBox(node) || isStimulus(node) || node?.type === 'interface') {
    container.append(field('Name',node.name,value => setProperty(node,'name',value)));
  }
  if (node?.parent) {
    const parent = get(node.parent);
    container.append(button('Select '+names[parent.type],() => select(parent.id),'full'));
  }
  if (isBox(node)) {
    const dimensions = document.createElement('div');
    dimensions.className = 'row';
    for (const [label,key,min] of [['Width','w',100],['Height','h',75]]) {
      dimensions.append(field(label,node[key],value => {
        if (Number.isFinite(value)) setProperty(node,key,value);
      },{type:'number',min,step:'any'}));
    }
    container.append(dimensions);
    const items = children(node.id);
    if (items.length) {
      const list = document.createElement('div');
      list.className = 'subsection';
      list.append(subtitle('Contained elements'));
      for (const child of items) list.append(button(child.name || names[child.type],() => select(child.id),'entry'));
      container.append(list);
    }
    if (node.type === 'composite') container.append(hint('Place partner Actors inside this box. Attach the shared Value Interface to its border.'));
  }
  if (node?.type === 'interface') {
    container.append(field('Side',node.side,value => setProperty(node,'side',value),{choices:[['left','Left'],['right','Right']]}));
    const list = document.createElement('div');
    list.className = 'subsection';
    list.append(subtitle('Value Offerings'));
    if (mode === 'offering' || mode === 'port') {
      list.append(hint(mode === 'offering' ? 'Choose the direction of the offering.' : 'Choose the direction of the port.'));
    }
    for (const [direction,label] of [['out','Outgoing'],['in','Incoming']]) {
      const offering = offeringFor(node,direction);
      const entry = document.createElement('div');
      entry.className = 'row';
      const pick = button(offering ? label+' ('+children(offering.id).length+')' : 'Add '+label.toLowerCase(),() => {
        if (mode === 'port') addOffering(node,direction,true);
        else if (offering) select(offering.id);
        else addOffering(node,direction,false);
      });
      entry.append(pick,button('+ Port',() => addOffering(node,direction,true)));
      list.append(entry);
      entry.style.marginBottom = '6px';
    }
    list.append(hint('Ports in the same direction form one offering. Group them in this interface to model a bundle.'));
    container.append(list);
  }
  if (node?.type === 'offering') {
    container.append(hint(node.direction === 'in' ? 'Incoming' : 'Outgoing'));
    container.append(button('Add Value Port',() => addOffering(get(node.parent),node.direction,true),'full'));
    const ports = children(node.id);
    ports.forEach((port,i) => container.append(button('Value Port '+(i+1),() => select(port.id),'entry')));
  }
  if (node?.type === 'port') {
    container.append(hint(get(node.parent).direction === 'in' ? 'Incoming port' : 'Outgoing port'));
    const exchanges = model.edges.filter(link => link.from === node.id || link.to === node.id);
    for (const exchange of exchanges) container.append(button(exchange.name || names.exchange,() => select(exchange.id),'entry'));
  }
  if (edge?.type === 'exchange') container.append(field('Value Object',edge.name,value => setProperty(edge,'name',value)));
  if (edge) {
    const endpoints = document.createElement('div');
    endpoints.className = 'row';
    endpoints.append(button('Select source',() => select(edge.from)),button('Select target',() => select(edge.to)));
    container.append(endpoints);
  }
  container.append(button('Delete element',() => remove(item.id),'remove full'));
}
function render() {
  draw();
  renderProperties();
  if (document.activeElement !== $('model-title')) $('model-title').value = model.title;
  $('undo').disabled = !undoStack.length;
  $('redo').disabled = !redoStack.length;
  $('stage').dataset.mode = ['pan','select'].includes(mode) ? mode : 'draw';
  for (const tool of document.querySelectorAll('[data-tool]')) tool.setAttribute('aria-pressed',mode === tool.dataset.tool);
}
function pointAt(event) {
  const rect = diagram.getBoundingClientRect();
  return {x:(event.clientX-rect.left-camera.x)/camera.scale,y:(event.clientY-rect.top-camera.y)/camera.scale};
}
function targetId(event) {
  return event.target.closest('[data-id]')?.dataset.id;
}
function boxAt(point,predicate) {
  return model.nodes.filter(node => isBox(node) && predicate(node)).filter(node => {
    const p = position(node);
    return point.x >= p.x && point.y >= p.y && point.x <= p.x+node.w && point.y <= p.y+node.h;
  }).sort((a,b) => a.w*a.h-b.w*b.h)[0];
}
function createAt(type,point,target) {
  const node = {id:uid(),type,name:isStimulus({type}) ? '' : names[type],parent:null};
  const clickedBox = isBox(target) ? target : null;
  let parent;
  if (type === 'activity') parent = clickedBox?.type === 'activity' ? get(clickedBox.parent) : clickedBox;
  else if (type === 'interface') parent = clickedBox;
  else if (isStimulus(node)) parent = clickedBox || boxAt(point,() => true);
  else parent = boxAt(point,box => box.type === 'composite');

  if (!allowedParent(type,parent)) {
    notice(instructions[type],true);
    return;
  }
  node.parent = parent?.id || null;
  const origin = parent ? position(parent) : {x:0,y:0};
  const x = point.x-origin.x;
  const y = point.y-origin.y;
  if (type === 'interface') {
    node.side = x < parent.w/2 ? 'left' : 'right';
    node.offset = clamp(y/parent.h,.12,.88);
  } else if (isStimulus(node)) {
    node.x = snap(x);
    node.y = snap(y);
  } else {
    node.w = {activity:125,composite:500,actor:210,market:210}[type];
    node.h = {activity:90,composite:360,actor:200,market:200}[type];
    if (parent && (node.w+16 > parent.w || node.h+54 > parent.h)) {
      notice('Increase the size of the parent to fit this element.',true);
      return;
    }
    node.x = parent ? clamp(snap(x),8,parent.w-node.w-8) : snap(x);
    node.y = parent ? clamp(snap(y),46,parent.h-node.h-8) : snap(y);
  }
  change(() => {
    model.nodes.push(node);
    selected = node.id;
    mode = 'select';
    notice(instructions.select);
  });
}
function linkTo(target) {
  if (!source) {
    const acceptable = mode === 'exchange'
      ? target?.type === 'port' && get(target.parent)?.direction === 'out'
      : target?.type === 'interface' || isStimulus(target);
    if (!acceptable) {
      notice(instructions[mode],true);
      return;
    }
    source = target.id;
    notice(mode === 'exchange' ? 'Click the incoming Value Port.' : 'Click the other Stimulus or Value Interface.');
    render();
    return;
  }
  const from = get(source);
  if (!validLink(mode,from,target)) {
    notice(mode === 'exchange' ? 'Choose an incoming port on a different Value Interface.'
      : 'Link a Stimulus to an interface, or link two interfaces in the same activity or between an actor and its activity.',true);
    return;
  }
  if (model.edges.some(edge => edge.type === mode && (
    (edge.from === source && edge.to === target.id)
    || (mode === 'connect' && edge.to === source && edge.from === target.id)
  ))) {
    notice('These elements are already connected.',true);
    return;
  }
  change(() => {
    const edge = {id:uid(),type:mode,from:source,to:target.id};
    if (mode === 'exchange') edge.name = 'Value Object';
    model.edges.push(edge);
    selected = edge.id;
    mode = 'select';
    source = null;
    notice(edge.type === 'exchange' ? 'Name the exchanged Value Object in Properties.' : instructions.select);
  });
}
diagram.addEventListener('click',event => {
  if (ignoreClick) return;
  const id = targetId(event);
  const target = get(id);
  if (mode === 'select') {
    select(id || null);
  } else if (mode === 'exchange' || mode === 'connect') {
    linkTo(target);
  } else if (mode === 'offering' || mode === 'port') {
    const iface = target?.type === 'offering' ? get(target.parent) : interfaceOf(target);
    if (iface?.type !== 'interface') {
      notice(instructions[mode],true);
      return;
    }
    selected = iface.id;
    notice('Choose the direction in Properties.');
    render();
  } else if (mode !== 'pan') {
    createAt(mode,pointAt(event),target);
  }
});
diagram.addEventListener('pointerdown',event => {
  ignoreClick = false;
  if (event.button !== 0 && event.button !== 1) return;
  const node = get(targetId(event));
  const pan = mode === 'pan' || event.button === 1;
  if (!pan && (mode !== 'select' || !node || ['port','offering'].includes(node.type))) return;
  drag = {node,pan,id:event.pointerId,x:event.clientX,y:event.clientY,started:false,
    baseX:pan ? camera.x : node.x,baseY:pan ? camera.y : node.y,
    before:pan ? null : JSON.stringify(model)};
});
diagram.addEventListener('pointermove',event => {
  if (!drag || drag.id !== event.pointerId) return;
  const dx = event.clientX-drag.x;
  const dy = event.clientY-drag.y;
  if (!drag.started) {
    if (Math.hypot(dx,dy)<4) return;
    drag.started = true;
    diagram.setPointerCapture(event.pointerId);
    $('stage').classList.add('dragging');
    if (!drag.pan) selected = drag.node.id;
  }
  if (drag.pan) {
    camera.x = drag.baseX+dx;
    camera.y = drag.baseY+dy;
    cameraView();
    return;
  }
  const node = drag.node;
  const parent = get(node.parent);
  if (node.type === 'interface') {
    const p = pointAt(event);
    const origin = position(parent);
    node.side = p.x-origin.x < parent.w/2 ? 'left' : 'right';
    node.offset = clamp((p.y-origin.y)/parent.h,.10,.90);
  } else {
    const x = snap(drag.baseX+dx/camera.scale);
    const y = snap(drag.baseY+dy/camera.scale);
    node.x = parent ? clamp(x,8,Math.max(8,parent.w-(node.w||6)-8)) : x;
    node.y = parent ? clamp(y,45,Math.max(45,parent.h-(node.h||6)-8)) : y;
  }
  draw();
});
function endDrag(event) {
  if (!drag || drag.id !== event.pointerId) return;
  if (drag.started) {
    ignoreClick = true;
    if (!drag.pan && JSON.stringify(model) !== drag.before) record(drag.before);
    $('stage').classList.remove('dragging');
    render();
  }
  drag = null;
}
diagram.addEventListener('pointerup',endDrag);
diagram.addEventListener('pointercancel',endDrag);
diagram.addEventListener('pointerleave',() => { if (drag && !drag.started) drag = null; });
diagram.addEventListener('wheel',event => {
  event.preventDefault();
  const bounds = diagram.getBoundingClientRect();
  if (event.ctrlKey || event.metaKey) zoomBy(Math.exp(-event.deltaY*.009),event.clientX-bounds.left,event.clientY-bounds.top);
  else {
    camera.x -= event.deltaX;
    camera.y -= event.deltaY;
    cameraView();
  }
},{passive:false});

const sections = [
  ['Participants',['actor','market','composite','activity']],
  ['Value exchange',['interface','offering','port','exchange']],
  ['Value scenario',['start','stop','connect']]
];
for (const [label,tools] of sections) {
  const section = document.createElement('div');
  section.className = 'section';
  section.append(subtitle(label));
  for (const type of tools) {
    const entry = button(names[type],() => setMode(type));
    entry.dataset.tool = type;
    entry.insertAdjacentHTML('afterbegin',icon(type));
    section.append(entry);
  }
  $('palette').append(section);
}
for (const [id,type] of [['select-tool','select'],['pan-tool','pan'],['undo','undo'],['redo','redo'],['zoom-out','minus'],['zoom-in','plus'],['fit','fit']]) {
  $(id).insertAdjacentHTML('afterbegin',icon(type));
}
for (const type of ['select','pan']) {
  $(type+'-tool').dataset.tool = type;
  $(type+'-tool').setAttribute('aria-label',type === 'select' ? 'Select' : 'Pan');
  $(type+'-tool').addEventListener('click',() => setMode(type));
}
$('undo').onclick = () => restore(undoStack,redoStack);
$('redo').onclick = () => restore(redoStack,undoStack);
$('zoom-in').onclick = () => zoomBy(1.2);
$('zoom-out').onclick = () => zoomBy(1/1.2);
$('fit').onclick = fit;
$('model-title').addEventListener('change',event => {
  const title = event.target.value.trim() || 'Untitled model';
  change(() => model.title = title);
  event.target.value = title;
});
function replaceModel(next) {
  change(() => {
    model = next;
    selected = null;
    source = null;
    mode = 'select';
  });
  notice(instructions.select);
  fit();
}
$('new-model').onclick = () => replaceModel(blank());
$('open-model').onclick = () => $('file').click();
$('file').addEventListener('change',async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    replaceModel(validate(JSON.parse(await file.text())));
    notice('Model opened.');
  } catch (error) {
    notice(error instanceof SyntaxError ? 'This file does not contain valid JSON.' : error.message,true);
  } finally {
    event.target.value = '';
  }
});
$('save-model').onclick = () => {
  const file = new Blob([JSON.stringify(model,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = (model.title.trim().replace(/[^\p{L}\p{N}._ -]/gu,'-') || 'value-model')+'.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  notice('Model downloaded.');
};
document.addEventListener('keydown',event => {
  if (event.key === 'Escape') {
    setMode('select');
    return;
  }
  if (event.target.closest('input, select, textarea') || drag) return;
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
    event.preventDefault();
    if (event.shiftKey) restore(redoStack,undoStack);
    else restore(undoStack,redoStack);
  }
  if (selected && (event.key === 'Delete' || event.key === 'Backspace')) {
    event.preventDefault();
    remove(selected);
  }
});
notice(instructions.select);
render();
requestAnimationFrame(fit);
</script>
</body>
