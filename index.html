<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Draw e³-value models with actors, value exchanges, and scenario paths.">
<title>e³-value Model Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="top-group"><div class="brand"><div class="brand-mark" aria-hidden="true">e³</div><strong>Value Model Editor</strong></div><div class="divider"></div><input class="doc-title" id="model-title" aria-label="Model name" maxlength="100"><div class="divider"></div><button class="tool icon-only" id="undo" aria-label="Undo" title="Undo (Ctrl/⌘+Z)"></button><button class="tool icon-only" id="redo" aria-label="Redo" title="Redo (Ctrl/⌘+Shift+Z)"></button></div>
  <div class="top-group"><button id="new-model">New</button><button id="open-model">Open</button><button id="save-model" class="primary">Save model</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</header>
<nav class="palette" id="palette" aria-label="Model elements"></nav>
<main class="work">
  <section class="stage" id="stage" aria-label="Model canvas">
    <svg class="diagram" id="diagram" xmlns="http://www.w3.org/2000/svg" aria-label="Value model diagram" tabindex="-1">
      <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c9d3c8"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/><g id="world"></g>
    </svg>
    <div class="empty" id="empty" hidden><strong>Start your model</strong><span>Place an Actor or Market Segment.</span></div>
    <div class="stage-caption" id="counts"></div>
    <nav class="zoom-controls" aria-label="Zoom controls"><button class="tool icon-only" id="zoom-out" aria-label="Zoom out"></button><span id="zoom" class="zoom-label">100%</span><button class="tool icon-only" id="zoom-in" aria-label="Zoom in"></button><button class="tool" id="fit" aria-label="Fit model" title="Fit model"><span>Fit</span></button></nav>
  </section>
  <aside class="inspector" aria-label="Properties"><h2 class="panel-title">Properties</h2><div id="properties"></div></aside>
</main>
<footer class="status"><span id="message" role="status"></span><span id="storage">Changes saved in this browser</span></footer>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
